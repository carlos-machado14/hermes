name: Bootstrap Hermes Upstream

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-upstream.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import official Hermes upstream
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 https://github.com/NousResearch/hermes-agent.git /tmp/hermes-upstream
          rm -rf /tmp/hermes-upstream/.git

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/hermes-upstream/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: bootstrap Hermes from official upstream"

          echo "IMPORT_COMMIT_SHA=$(git rev-parse HEAD)"
          echo "IMPORT_TREE_SHA=$(git rev-parse HEAD^{tree})"

          git tag -f bootstrap-official-upstream
          git push --force origin refs/tags/bootstrap-official-upstream

# bootstrap-trigger: 5
